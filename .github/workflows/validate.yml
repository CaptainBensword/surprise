name: Validate Psychedelic
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s+type="module")?>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 2) {
            throw new Error('Expected the UI script and the 3D game module');
          }
          fs.writeFileSync('/tmp/psychedelic-ui.js', scripts[0][1]);
          fs.writeFileSync('/tmp/psychedelic-game.mjs', scripts[1][1]);
          NODE
          node --check /tmp/psychedelic-ui.js
          node --check /tmp/psychedelic-game.mjs
